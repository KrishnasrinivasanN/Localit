<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Register - Localit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <canvas id="auth-bg-canvas"></canvas>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
(function () {
  const canvas = document.getElementById('auth-bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  const DOTS = [
    { x: 0, y: 0, vx: 0.8, vy: 0.5 },
    { x: 0, y: 0, vx: -0.6, vy: 0.7 },
    { x: 0, y: 0, vx: 0.5, vy: -0.8 },
    { x: 0, y: 0, vx: -0.9, vy: -0.4 },
    { x: 0, y: 0, vx: 0.7, vy: -0.6 },
    { x: 0, y: 0, vx: 0.4, vy: 0.4 }, // New Dot
  ];

  function initDots() {
  DOTS.forEach((d) => {
    d.x = Math.random() * W; // Random starting X
    d.y = Math.random() * H; // Random starting Y
    // Optional: Randomize speed slightly so they don't look uniform
    d.vx = (Math.random() - 0.5) * 2; 
    d.vy = (Math.random() - 0.5) * 2;
  });
}

  function drawDot(x, y) {
    // glow
    const g = ctx.createRadialGradient(x, y, 0, x, y, 40);
    g.addColorStop(0, 'rgba(129,140,248,0.35)');
    g.addColorStop(1, 'rgba(129,140,248,0)');
    ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2);
    ctx.fillStyle = g; ctx.fill();
    // solid dot
    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180,188,252,0.9)';
    ctx.fill();
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const d of DOTS) {
      d.x += d.vx;
      d.y += d.vy;
      // bounce off walls
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;
      drawDot(d.x, d.y);
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { resize(); initDots(); });
  setTimeout(() => { resize(); initDots(); tick(); }, 100);
})();
</script>

  <!-- React login — your login.js -->
  <script type="text/babel" src="login.js"></script>
</body>
</html>
