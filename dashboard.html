<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Localit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #09090b; --surface: #111113; --surface-2: #18181b;
  --border: #27272a; --border-2: #3f3f46;
  --text: #fafafa; --text-2: #a1a1aa; --text-3: #52525b;
  --accent: #818cf8; --accent-dim: rgba(129,140,248,0.12);
  --orange: #f97316; --orange-dim: rgba(249,115,22,0.12);
  --green: #34d399; --green-dim: rgba(52,211,153,0.12);
  --red: #f87171;
  --font-sans: 'Instrument Sans', sans-serif;
  --font-mono: 'Geist Mono', monospace;
  --radius: 6px; --header-h: 52px;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.header { height: var(--header-h); display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); gap: 16px; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 28px; height: 28px; background: var(--accent); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.logo-text { display: flex; flex-direction: column; }
.logo-main { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
.logo-sub { font-size: 10px; color: var(--text-3); line-height: 1.2; }
.header-center { flex: 1; display: flex; justify-content: center; }
.status-pill { font-size: 11px; font-family: var(--font-mono); padding: 3px 10px; border-radius: 100px; font-weight: 500; animation: fadeIn 0.3s ease; }
.status-clean { background: var(--green-dim); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
.status-issues { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(249,115,22,0.25); }
.header-right { display: flex; align-items: center; gap: 8px; }
.user-email { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); margin-right: 4px; }
.header-actions { display: flex; align-items: center; gap: 6px; }
.btn-ghost, .btn-ai, .btn-logout { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: var(--radius); font-size: 12px; font-weight: 500; font-family: var(--font-sans); cursor: pointer; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s, opacity 0.15s; }
.btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-2); }
.btn-ai { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-ai:hover { opacity: 0.85; }
.btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-logout { background: transparent; color: var(--text-3); border-color: transparent; }
.btn-logout:hover { color: var(--red); }
.btn-icon { padding: 5px 7px !important; }
.header-divider { width: 1px; height: 16px; background: var(--border); margin: 0 2px; }
.main { flex: 1; display: grid; grid-template-columns: 0px 1fr 340px; transition: grid-template-columns 0.3s ease; overflow: hidden; }
.main:has(.history-open) { grid-template-columns: 240px 1fr 340px; }
.pane { display: flex; flex-direction: column; overflow: hidden; }
.pane-editor { border-right: 1px solid var(--border); }
.pane-results { background: var(--surface); }
.pane-titlebar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex-shrink: 0; }
.pane-filename { font-size: 11px; color: var(--text-2); font-family: var(--font-mono); }
.pane-badge { margin-left: auto; font-size: 10px; font-family: var(--font-mono); background: var(--orange-dim); color: var(--orange); border-radius: 100px; padding: 1px 6px; min-width: 18px; text-align: center; }
.editor-body { flex: 1; display: flex; overflow: hidden; background: #09090b; }
.gutter { padding: 16px 10px 16px 0; background: #0d0d10; color: var(--text-3); font-family: var(--font-mono); font-size: 13px; line-height: 21px; text-align: right; user-select: none; overflow: hidden; min-width: 48px; border-right: 1px solid var(--border); }
.gutter-line { height: 21px; padding-right: 10px; }
.editor-textarea { flex: 1; background: transparent; color: #cdd6f4; border: none; outline: none; padding: 16px; font-family: var(--font-mono); font-size: 13px; line-height: 21px; resize: none; white-space: pre; overflow: auto; tab-size: 2; caret-color: var(--accent); }
.editor-textarea::placeholder { color: var(--text-3); }
.editor-textarea::-webkit-scrollbar { width: 6px; height: 6px; }
.editor-textarea::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
.results-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
.results-body::-webkit-scrollbar { width: 4px; }
.results-body::-webkit-scrollbar-thumb { background: var(--border); }
.result-group { display: flex; flex-direction: column; gap: 6px; }
.result-group-label { display: flex; align-items: center; gap: 5px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); font-weight: 600; padding: 0 2px; }
.issue-card { padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); animation: slideIn 0.2s ease; }
.issue-rule { border-left: 2px solid var(--orange); }
.issue-ai { border-left: 2px solid var(--accent); }
.issue-key { font-family: var(--font-mono); font-size: 12px; color: var(--text); font-weight: 500; margin-bottom: 3px; }
.issue-detail { font-size: 12px; color: var(--text-2); line-height: 1.4; }
.issue-fix { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fix-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
.fix-value { font-family: var(--font-mono); font-size: 11px; color: var(--green); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-apply { font-size: 11px; font-weight: 600; font-family: var(--font-sans); background: var(--accent); color: #fff; border: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; transition: opacity 0.15s; flex-shrink: 0; }
.btn-apply:hover { opacity: 0.8; }
.skeleton { height: 56px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); text-align: center; padding: 32px; }
.empty-icon { opacity: 0.3; margin-bottom: 4px; }
.empty-title { font-size: 13px; font-weight: 500; color: var(--text-2); }
.empty-sub { font-size: 11px; line-height: 1.6; color: var(--text-3); max-width: 200px; }
.splash { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); }
.splash-logo { width: 40px; height: 40px; background: var(--accent); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.splash-text { font-size: 13px; color: var(--text-3); font-family: var(--font-mono); }
.dots span { animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.spin { animation: rotate 1s linear infinite; }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.history-panel { width: 0; overflow: hidden; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width 0.3s ease; flex-shrink: 0; }
.history-panel.history-open { width: 240px; }
.history-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); flex-shrink: 0; }
.history-title { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.history-count { font-size: 10px; font-family: var(--font-mono); background: var(--accent-dim); color: var(--accent); border-radius: 100px; padding: 1px 6px; min-width: 18px; text-align: center; }
.history-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb { background: var(--border); }
.history-empty { font-size: 11px; color: var(--text-3); padding: 16px 8px; text-align: center; line-height: 1.6; }
.history-item { padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; transition: border-color 0.15s, background 0.15s; white-space: nowrap; }
.history-item:hover { border-color: var(--accent); background: var(--accent-dim); }
.history-item-label { font-size: 12px; color: var(--text); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; }
.history-item-time { font-size: 10px; color: var(--text-3); margin-top: 3px; }
.tab-bar { display: flex; align-items: center; background: var(--surface-2); border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; height: 36px; }
.tab-bar::-webkit-scrollbar { height: 0; }
.tab { display: flex; align-items: center; gap: 6px; padding: 0 14px; height: 36px; font-size: 12px; font-family: var(--font-mono); color: var(--text-3); cursor: pointer; border-right: 1px solid var(--border); white-space: nowrap; transition: color 0.15s, background 0.15s; flex-shrink: 0; }
.tab:hover { color: var(--text-2); background: var(--surface); }
.tab-active { color: var(--text); background: var(--bg); border-bottom: 2px solid var(--accent); }
.tab-label { overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.tab-close { font-size: 14px; color: var(--text-3); line-height: 1; padding: 0 2px; border-radius: 3px; transition: color 0.15s, background 0.15s; }
.tab-close:hover { color: var(--red); background: rgba(248,113,113,0.1); }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s ease; }
.modal-panel { background: var(--surface); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); width: 100%; max-width: 400px; position: relative; }
.modal-close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 20px; line-height: 1; }
.mfa-qr-code { background: white; padding: 16px; border-radius: var(--radius); margin: 16px auto; display: block; }
.mfa-secret { font-family: var(--font-mono); background: var(--surface-2); padding: 8px 12px; border-radius: 4px; word-break: break-all; text-align: center; letter-spacing: 0.1em; margin: 16px 0; }
.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; color: var(--text-2); }
.form-input { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 8px 12px; font-family: var(--font-sans); font-size: 13px; outline: none; }
.form-input:focus { border-color: var(--accent); }
.input-error { border-color: var(--red) !important; }
.field-error { font-size: 11px; color: var(--red); }
.btn-primary { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-sans); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-loading { display: flex; gap: 3px; }
.btn-loading span { width: 4px; height: 4px; background: #fff; border-radius: 50%; animation: blink 1.2s infinite; }
.btn-loading span:nth-child(2) { animation-delay: 0.2s; }
.btn-loading span:nth-child(3) { animation-delay: 0.4s; }
.muted-copy { font-size: 13px; color: var(--text-2); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="dashboard.js"></script>
</body>
</html>
